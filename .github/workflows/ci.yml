name: CI

on:
    pull_request:
    push:
        branches: [main]

# A newer push to the same branch or PR supersedes the running check.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        # Placeholders that satisfy src/env.js. No test talks to these
        # services; they only need to parse.
        env:
            DATABASE_URL: postgres://ci:ci@localhost:5432/ci
            BETTER_AUTH_URL: http://localhost:3000
            BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-anywhere
            GOOGLE_CLIENT_ID: ci
            GOOGLE_CLIENT_SECRET: ci
            JUDGE_URL: http://localhost:2358
            BASE_URL: http://localhost:3000

        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 24

            # Installs from bun.lockb. Also needed at test time: the LSP
            # client test runs the real lsp-gateway, which is a Bun service.
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.10

            - name: Install
              id: install
              run: bun install --frozen-lockfile

            # Later steps run even if an earlier check fails, so one run
            # reports every problem.
            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: npm run lint

            - name: Format
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: npm run format:check

            - name: Test
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: npm test
